<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Deutsch A1 – Was passt?</title><style>body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f5f7f8;color:#263238;margin:0;padding:24px}.wrap{max-width:760px;margin:auto;background:white;padding:32px;border-radius:18px;box-shadow:0 5px 25px #0001}h1{margin:0 0 8px;font-size:30px}.sub{color:#61717a}.words{display:flex;flex-wrap:wrap;gap:8px;margin:24px 0}.word{background:#eaf1f2;border-radius:8px;padding:8px 12px;font-weight:600}.q{padding:16px 0;border-bottom:1px solid #e6ecee;line-height:2.5}.q input{width:155px;max-width:48%;padding:9px 10px;font:inherit;border:1px solid #a9b8bd;border-radius:7px}.q input.correct{border-color:#25845c;background:#edf9f2}.q input.wrong{border-color:#c45252;background:#fff1f1}.feedback{font-size:14px;margin-left:8px;font-weight:600}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}button{background:#235d68;color:white;border:0;padding:12px 18px;border-radius:9px;font:inherit;cursor:pointer}button.secondary{background:#e8eff1;color:#263238}#score{margin-top:16px;font-weight:700}.note{margin-top:22px;font-size:13px;color:#66777d}@media(max-width:550px){.wrap{padding:20px}.q input{width:125px}}</style></head><body><main class="wrap"><div class="sub">DEUTSCH · A1 · WORTSCHATZ</div><h1>Was passt?</h1><p>Ergänze die Wörter. Achte auf die richtige Verbform!<br><span class="sub">Doplň slova. U sloves dej pozor na správný tvar.</span></p><div class="words"><span class="word">denken (2×)</span><span class="word">kennen</span><span class="word">Lieblings-</span><span class="word">Hafen (2×)</span><span class="word">Kräutertee</span><span class="word">Saft</span><span class="word">besonders</span></div><div id="questions"></div><div class="buttons"><button id="check">Zkontrolovat odpovědi</button><button id="show" class="secondary">Ukázat řešení</button><button id="reset" class="secondary">Zkusit znovu</button></div><div id="score" aria-live="polite"></div><p class="note">U slova Lieblings- doplň pouze první část složeného slova.</p></main><script>const data=[['Ich trinke gern Apfel','saft','Saft','.'],['Mein','lieblings','Lieblings-','essen ist Pizza.'],['Im','hafen','Hafen','liegen viele Schiffe.'],['Ich bin krank. Ich trinke einen','tee','Kräutertee','.'],['Ich','kennen','kenne','Berlin sehr gut.'],['Was','denken','denkst','du? Ist das eine gute Idee?'],['Der Film ist','besonders','besonders','interessant.'],['Viele Schiffe fahren in den','hafen','Hafen','.'],['Ich','denken','denke','oft an meinen Urlaub.']];const root=document.getElementById('questions');data.forEach((q,i)=>{const row=document.createElement('div');row.className='q';row.innerHTML=`<strong>${i+1}.</strong> ${q[0]} <input aria-label="Odpověď ${i+1}" autocomplete="off" spellcheck="false"> ${q[3]} <span class="feedback" aria-live="polite"></span>`;root.append(row)});const norm=s=>s.trim().toLocaleLowerCase('de-DE').replace(/[-–—]$/,'');document.getElementById('check').onclick=()=>{let n=0;document.querySelectorAll('.q').forEach((r,i)=>{const inp=r.querySelector('input'),ok=norm(inp.value)===norm(data[i][2]);n+=ok?1:0;inp.className=ok?'correct':'wrong';r.querySelector('.feedback').textContent=ok?'✓':'✗';r.querySelector('.feedback').style.color=ok?'#25845c':'#c45252'});document.getElementById('score').textContent=`Správně: ${n} z ${data.length}`};document.getElementById('show').onclick=()=>{document.querySelectorAll('.q').forEach((r,i)=>{r.querySelector('.feedback').textContent='Řešení: '+data[i][2];r.querySelector('.feedback').style.color='#235d68'});document.getElementById('score').textContent='Zobrazeno řešení.'};document.getElementById('reset').onclick=()=>{document.querySelectorAll('.q').forEach(r=>{r.querySelector('input').value='';r.querySelector('input').className='';r.querySelector('.feedback').textContent=''});document.getElementById('score').textContent=''};</script></body></html>
